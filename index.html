<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
        initial-scale=1.0,
        maximum-scale=1.0,
        user-scalable=no"
    >

    <title>业务菜单</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                sans-serif;
            background: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #222222);
        }

        body {
            padding: 18px;
        }

        .container {
            width: 100%;
            max-width: 520px;
            margin: 0 auto;
        }

        .title {
            text-align: center;
            font-size: 23px;
            font-weight: 700;
            margin-top: 8px;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            font-size: 14px;
            opacity: 0.65;
            margin-bottom: 22px;
        }

        .menu {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .button {
            width: 100%;
            min-height: 58px;
            border: none;
            border-radius: 12px;

            background:
                var(--tg-theme-secondary-bg-color, #f1f1f1);

            color:
                var(--tg-theme-text-color, #222222);

            font-size: 16px;
            font-weight: 600;

            cursor: pointer;

            transition:
                transform 0.1s ease,
                opacity 0.1s ease;
        }

        .button:active {
            transform: scale(0.97);
            opacity: 0.75;
        }

        .page {
            display: none;
        }

        .page.active {
            display: block;
        }

        .content {
            white-space: pre-line;

            line-height: 1.7;

            font-size: 16px;

            padding: 18px;

            border-radius: 14px;

            background:
                var(--tg-theme-secondary-bg-color, #f1f1f1);
        }

        .back {
            width: 100%;
            margin-top: 14px;

            min-height: 50px;

            border: none;

            border-radius: 12px;

            background:
                var(--tg-theme-button-color, #2481cc);

            color:
                var(--tg-theme-button-text-color, #ffffff);

            font-size: 16px;

            font-weight: 600;
        }

        .service {
            width: 100%;
            margin-top: 10px;

            min-height: 50px;

            border: none;

            border-radius: 12px;

            background:
                var(--tg-theme-button-color, #2481cc);

            color:
                var(--tg-theme-button-text-color, #ffffff);

            font-size: 16px;

            font-weight: 600;
        }

    </style>
</head>

<body>

<div class="container">

    <!-- ==================== -->
    <!-- 主菜单 -->
    <!-- ==================== -->

    <div
        id="home"
        class="page active"
    >

        <div class="title">
            业务菜单
        </div>

        <div class="subtitle">
            请选择您要办理的业务
        </div>

        <div class="menu">

            <button
                class="button"
                onclick="openPage('special_group')"
            >
                拉专群
            </button>

            <button
                class="button"
                onclick="openPage('public_group')"
            >
                开公群
            </button>

            <button
                class="button"
                onclick="openPage('consult')"
            >
                咨询 / 解封
            </button>

            <button
                class="button"
                onclick="openPage('ad_member')"
            >
                广告 / 会员
            </button>

            <button
                class="button"
                onclick="openPage('report')"
            >
                纠纷 / 举报
            </button>

            <button
                class="button"
                onclick="openPage('resource')"
            >
                资源对接
            </button>

            <button
                class="button"
                onclick="openPage('suggestion')"
            >
                投诉建议
            </button>

            <button
                class="button"
                onclick="openPage('verify')"
            >
                自助验群
            </button>

            <button
                class="button"
                onclick="openPage('restore')"
            >
                销群恢复
            </button>

            <button
                class="button"
                onclick="openPage('guide')"
            >
                新手必读
            </button>

        </div>

    </div>


    <!-- ==================== -->
    <!-- 内容页面 -->
    <!-- ==================== -->

    <div
        id="contentPage"
        class="page"
    >

        <div
            id="content"
            class="content"
        ></div>

        <button
            id="serviceButton"
            class="service"
            onclick="contactService()"
            style="display:none;"
        >
            联系人工客服
        </button>

        <button
            class="back"
            onclick="goHome()"
        >
            返回业务菜单
        </button>

    </div>

</div>


<script>

    const tg = window.Telegram.WebApp;

    tg.ready();

    tg.expand();


    const business = {

        special_group:
            "拉专群\n\n" +
            "如需创建或咨询专属群组，请联系客服。\n\n" +
            "请提供：\n" +
            "• 群组用途\n" +
            "• 预计人数\n" +
            "• 需要的服务",

        public_group:
            "开公群\n\n" +
            "如需创建公开群组，请联系客服。\n\n" +
            "请提供：\n" +
            "• 群组名称\n" +
            "• 群组类型\n" +
            "• 群组用途",

        consult:
            "咨询 / 解封\n\n" +
            "如果您的账号、群组或相关业务遇到问题，" +
            "可以联系客服进行咨询。\n\n" +
            "请尽量提供详细情况。",

        ad_member:
            "广告 / 会员\n\n" +
            "如需咨询广告发布、会员服务等业务，" +
            "请联系客服了解具体方案。",

        report:
            "纠纷 / 举报\n\n" +
            "如发现违规内容或存在纠纷，请提交相关信息。\n\n" +
            "建议提供：\n" +
            "• 群组 / 用户信息\n" +
            "• 相关截图\n" +
            "• 具体问题描述",

        resource:
            "资源对接\n\n" +
            "如有合作、资源交换或商务对接需求，" +
            "请联系客服。",

        suggestion:
            "投诉建议\n\n" +
            "如果您对服务有意见、建议或投诉，" +
            "可以提交相关情况。",

        verify:
            "自助验群\n\n" +
            "请输入您所在的群编号进行验证。",

        restore:
            "销群恢复\n\n" +
            "如果群组出现异常、误操作或需要恢复相关服务，" +
            "请联系客服咨询。",

        guide:
            "新手必读\n\n" +
            "1. 请勿相信陌生人发送的可疑链接。\n" +
            "2. 不要向任何人泄露密码或验证码。\n" +
            "3. 办理业务时请提供准确的信息。\n" +
            "4. 遇到问题可以联系客服。"

    };


    function openPage(key) {

        document
            .getElementById("home")
            .classList
            .remove("active");

        document
            .getElementById("contentPage")
            .classList
            .add("active");

        document
            .getElementById("content")
            .textContent =
            business[key] || "暂无内容";

        const serviceButton =
            document.getElementById("serviceButton");

        serviceButton.style.display =
            "block";
    }


    function goHome() {

        document
            .getElementById("contentPage")
            .classList
            .remove("active");

        document
            .getElementById("home")
            .classList
            .add("active");
    }


    function contactService() {

        const username = "YOUR_SERVICE_USERNAME";

        if (
            username &&
            username !== "YOUR_SERVICE_USERNAME"
        ) {

            const clean =
                username.replace("@", "");

            tg.openTelegramLink(
                "https://t.me/" + clean
            );

        } else {

            tg.showAlert(
                "暂未设置人工客服账号"
            );

        }

    }

</script>

</body>
</html>
